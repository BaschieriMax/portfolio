# Netlify build and deploy settings (D-008).
# Node version comes from .nvmrc; VITE_WEB3FORMS_ACCESS_KEY is set in the Netlify UI.

[build]
  # A failing lint or test stops the deploy and keeps the previous version online
  command = "npm run lint && npm test && npm run build"
  publish = "dist"

# Unknown paths show the portfolio instead of the Netlify 404 page
# (existing files such as /cv/*.pdf are served first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so browsers can cache them forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
