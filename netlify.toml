# Netlify build and deploy settings (D-008).
# Node version comes from .nvmrc; VITE_WEB3FORMS_ACCESS_KEY is set in the Netlify UI.

[build]
  # A failing lint or test stops the deploy and keeps the previous version online
  command = "npm run lint && npm test && npm run build"
  publish = "dist"

# Unknown paths show the portfolio instead of the Netlify 404 page
# (existing files such as /cv/*.pdf are served first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (D-010). The CSP allows only same-origin code plus the Web3Forms API;
# 'unsafe-inline' styles are needed by react-hot-toast and React style attributes.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change, so browsers can cache them forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
